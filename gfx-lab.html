<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>그래픽 업데이트 시험</title>
  <!-- 2026-11-22 그래픽 업데이트 모듈(src/gfx3d) 시험 — three.js 로 만든 항해 · 섬 짓기 등대. 지금 게임 화면은 바꾸지 않는다.
       주소 옵션: ?scene=voyage|lighthouse · ?hour=18.2 · ?bloom=0 -->
  <script type="importmap">{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/addons/" } }</script>
  <style>
    :root { --bg: #f4ecdc; --ink: #3d2b1c; --soft: #8a7258; --line: #e2d3b6; --accent: #b4532a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1e1b17; --ink: #f1e6d2; --soft: #b9a68a; --line: #3a332a; --accent: #e08a5c; } }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0 12px 0 0; font-size: 17px; }
    button { min-height: 40px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; cursor: pointer; }
    button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--soft); }
    input[type=range] { width: 160px; accent-color: var(--accent); }
    #fps { margin-left: auto; font-size: 13px; color: var(--soft); font-variant-numeric: tabular-nums; }
    main { position: relative; flex: 1; min-height: 0; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #msg { position: absolute; left: 16px; bottom: 16px; padding: 6px 12px; border-radius: 99px; background: rgba(0,0,0,.45); color: #fff; font-size: 13px; }
  </style>
</head>
<body>
  <div class="bar">
    <h1>그래픽 업데이트 시험</h1>
    <button data-scene="voyage">항해</button>
    <button data-scene="lighthouse">등대</button>
    <label>시각 <input id="hour" type="range" min="0" max="24" step="0.1" /> <b id="hourTxt"></b></label>
    <button data-hour="12">낮</button><button data-hour="18.2">노을</button><button data-hour="23">밤</button><button data-hour="6.4">새벽</button>
    <button id="bloom" aria-pressed="true">빛 번짐</button>
    <span id="fps"></span>
  </div>
  <main><canvas id="cv"></canvas><div id="msg">불러오는 중…</div></main>
  <script type="module">
    import { mountGfx3D, canUse3D } from './src/gfx3d/index.js';
    const q = new URLSearchParams(location.search);
    let kind = q.get('scene') === 'lighthouse' ? 'lighthouse' : 'voyage';
    let hour = q.has('hour') ? +q.get('hour') : (kind === 'lighthouse' ? 23 : 18.2);
    let bloom = q.get('bloom') !== '0';
    const main = document.querySelector('main'), msg = document.getElementById('msg'), hourEl = document.getElementById('hour'), hourTxt = document.getElementById('hourTxt');
    let scene = null, gen = 0;
    const fmt = h => `${Math.floor(h)}:${String(Math.round((h % 1) * 60)).padStart(2, '0')}`;
    function sync() {
      document.querySelectorAll('[data-scene]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.scene === kind)));
      document.getElementById('bloom').setAttribute('aria-pressed', String(bloom));
      hourEl.value = hour; hourTxt.textContent = fmt(hour);
      const u = new URL(location); u.searchParams.set('scene', kind); u.searchParams.set('hour', hour); u.searchParams.set('bloom', bloom ? 1 : 0); history.replaceState(null, '', u);
    }
    async function open() {
      const my = ++gen; sync();
      if (scene) { scene.dispose(); scene = null; }
      const old = document.getElementById('cv'), cv = old.cloneNode(); old.replaceWith(cv);   // 장면마다 새 캔버스 (WebGL 컨텍스트를 새로)
      msg.hidden = false; msg.textContent = '불러오는 중…';
      if (!canUse3D()) { msg.textContent = '이 기기는 WebGL2 가 안 돼서 3D 장면을 못 엽니다'; return; }
      try {
        const s = await mountGfx3D(kind, cv, { hour, bloom });
        if (my !== gen) { s.dispose(); return; }
        scene = s; msg.hidden = true;
      } catch (e) { msg.textContent = '열지 못했어요: ' + e.message; console.error(e); }
    }
    document.querySelectorAll('[data-scene]').forEach(b => b.onclick = () => { if (kind !== b.dataset.scene) { kind = b.dataset.scene; open(); } });
    document.querySelectorAll('[data-hour]').forEach(b => b.onclick = () => { hour = +b.dataset.hour; scene?.setHour(hour); sync(); });
    hourEl.oninput = () => { hour = +hourEl.value; scene?.setHour(hour); sync(); };
    document.getElementById('bloom').onclick = () => { bloom = !bloom; scene?.setBloom(bloom); sync(); };
    new ResizeObserver(() => { const r = main.getBoundingClientRect(); scene?.resize(r.width, r.height, devicePixelRatio || 1); }).observe(main);
    // 초당 그림 수 (대략)
    let n = 0, t0 = performance.now();
    (function tick() { n++; const t = performance.now(); if (t - t0 > 1000) { document.getElementById('fps').textContent = `${Math.round(n * 1000 / (t - t0))} fps`; n = 0; t0 = t; } requestAnimationFrame(tick); })();
    window.__gfx = () => scene;   // 시험용
    open();
  </script>
</body>
</html>
